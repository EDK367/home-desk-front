<div class="app-layout">
  <app-sidebar></app-sidebar>
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

@if (toast?.show) {
  <div class="global-toast-container" [class.toast-success]="toast?.type === 'success'" [class.toast-error]="toast?.type === 'error'">
    <div class="global-toast-icon">
      @if (toast?.type === 'success') {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      } @else {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      }
    </div>
    <div class="global-toast-content">
      <h4 class="global-toast-title">{{ toast?.title }}</h4>
      <p class="global-toast-message">{{ toast?.message }}</p>
    </div>
    <button (click)="closeToast()" class="global-toast-close" title="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
}
