<div class="dashboard-container">
  <header class="page-header">
    <div class="header-titles">
      <h1 class="page-title">Panel de Administración</h1>
    </div>
    <div class="header-actions">
      <a mat-flat-button color="primary" routerLink="/admin/users" [queryParams]="{ action: 'new' }">
        <mat-icon>person_add</mat-icon>
        <span>Nuevo usuario</span>
      </a>
    </div>
  </header>

  <mat-card class="welcome-banner" appearance="outlined">
    <mat-card-content class="banner-content">
      <div class="banner-text">
        <h2>¡Hola, {{ userFirstName }}!</h2>
      </div>
      <div class="banner-badge">
      </div>
    </mat-card-content>
  </mat-card>


  <section class="shortcuts-section">
    <h3 class="section-heading">Accesos Directos</h3>
    <div class="shortcuts-grid">
      <mat-card class="shortcut-card" appearance="outlined" routerLink="/admin/users">
        <mat-card-content class="shortcut-content">
          <div class="shortcut-icon icon-users">
            <mat-icon>people</mat-icon>
          </div>
          <div class="shortcut-text">
            <h4>Gestión de Usuarios</h4>
          </div>
          <mat-icon class="shortcut-arrow">chevron_right</mat-icon>
        </mat-card-content>
      </mat-card>

      <mat-card class="shortcut-card" appearance="outlined" routerLink="/admin/roles">
        <mat-card-content class="shortcut-content">
          <div class="shortcut-icon icon-roles">
            <mat-icon>manage_accounts</mat-icon>
          </div>
          <div class="shortcut-text">
            <h4>Roles del Sistema</h4>
          </div>
          <mat-icon class="shortcut-arrow">chevron_right</mat-icon>
        </mat-card-content>
      </mat-card>

      <mat-card class="shortcut-card" appearance="outlined" routerLink="/admin/profile">
        <mat-card-content class="shortcut-content">
          <div class="shortcut-icon icon-account">
            <mat-icon>account_circle</mat-icon>
          </div>
          <div class="shortcut-text">
            <h4>Mi Perfil</h4>
          </div>
          <mat-icon class="shortcut-arrow">chevron_right</mat-icon>
        </mat-card-content>
      </mat-card>
    </div>
  </section>
</div>
